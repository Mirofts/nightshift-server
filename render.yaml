# Render.com blueprint: the shared online matchmaking server for Night Shift (server only, the game is hosted on CrazyGames / itch.io).
services:
  - type: web
    name: night-shift
    runtime: node
    plan: free
    buildCommand: "echo no build needed"
    startCommand: "node server.js"
    healthCheckPath: /health
    envVars:
      - key: STATIC
        value: "0"
